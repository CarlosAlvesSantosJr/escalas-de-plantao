# Emissor de certificados do Let's Encrypt (requer o cert-manager instalado no cluster).
# Aplique uma vez:  kubectl apply -f k8s/cluster-issuer.yaml
# Troque o e-mail: o Let's Encrypt avisa nele quando um certificado está para vencer.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: SEU-EMAIL@exemplo.com
    privateKeySecretRef:
      name: letsencrypt-conta
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
