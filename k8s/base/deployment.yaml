apiVersion: apps/v1
kind: Deployment
metadata:
  name: escala
  labels:
    app.kubernetes.io/name: escala
spec:
  # UMA réplica, sempre: os dados ficam num arquivo JSON com trava em memória,
  # que não é compartilhada entre pods. Recreate evita dois pods ao mesmo tempo
  # durante uma atualização (o disco ReadWriteOnce também não permitiria).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: escala
  template:
    metadata:
      labels:
        app.kubernetes.io/name: escala
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: escala
          image: escala-plantao   # trocada pelo kustomization.yaml (images:)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: ESCALA_DADOS
              value: /data/dados_escala.json
            - name: ESCALA_AUDITORIA
              value: /data/auditoria.jsonl
            - name: ESCALA_USUARIOS
              value: /etc/escala/usuarios.json
            - name: ESCALA_ATRAS_DE_PROXY   # usa o IP real do cliente (vem do Ingress)
              value: "1"
            - name: ESCALA_COOKIE_SEGURO    # cookie de sessão só por HTTPS
              value: "1"
            - name: ESCALA_SESSAO_HORAS
              value: "12"
            - name: ESCALA_AUDITORIA_DIAS   # auditoria guarda só os últimos N dias
              value: "30"
            - name: ESCALA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: escala-segredos
                  key: ESCALA_SECRET_KEY
          volumeMounts:
            - name: dados
              mountPath: /data
            - name: usuarios
              mountPath: /etc/escala
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: { path: /saude, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /saude, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: dados
          persistentVolumeClaim:
            claimName: escala-dados
        - name: usuarios
          secret:
            secretName: escala-segredos
            items:
              - key: usuarios.json
                path: usuarios.json
        - name: tmp
          emptyDir: {}
