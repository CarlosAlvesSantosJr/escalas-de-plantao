# Túnel rápido da Cloudflare (sem conta): o endereço público aparece no log
# e MUDA sempre que este pod reinicia. Para um endereço fixo no seu domínio,
# use k8s/tunel-fixo/ (túnel nomeado; veja k8s/README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.4.0
          args: ["tunnel", "--no-autoupdate", "--url", "http://escala.escala-plantao.svc.cluster.local:80"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
