# Kubernetes no próprio PC (Docker Desktop) + Cloudflare Tunnel.
# O cloudflared abre uma conexão de saída até a Cloudflare, que entrega um
# endereço https://xxxx.trycloudflare.com. Não precisa abrir portas no
# roteador nem ter domínio. Só funciona enquanto o PC estiver ligado.
#
#   docker build -t escala-plantao:1.1.1 .     (mesma tag de newTag, abaixo)
#   kubectl apply -k k8s/tunel/
#   kubectl -n escala-plantao logs deploy/cloudflared | grep trycloudflare
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: escala-plantao

resources:
  - ../base
  - cloudflared.yaml

# Imagem construída localmente (o Kubernetes do Docker Desktop enxerga as imagens do Docker).
images:
  - name: escala-plantao
    newName: escala-plantao
    newTag: "1.1.1"   # troque a cada versão nova
