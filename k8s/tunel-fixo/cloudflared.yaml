# Túnel NOMEADO da Cloudflare: endereço fixo (ex.: https://escala.seudominio.com.br)
# que não muda quando o pod reinicia. O endereço e o destino são configurados no
# painel da Cloudflare (Zero Trust → Networks → Tunnels → Public Hostname); aqui
# o pod só precisa do token do túnel, que vem do Secret "cloudflared-token".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.4.0
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN          # o cloudflared lê o token desta variável
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: TUNNEL_TOKEN
          ports:
            - name: metrics
              containerPort: 2000
          readinessProbe:                 # pronto = conectado à Cloudflare
            httpGet: { path: /ready, port: metrics }
            periodSeconds: 10
          livenessProbe:                  # perdeu a conexão por ~2 min → reinicia
            httpGet: { path: /ready, port: metrics }
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
